      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      margin: 1rem 0;
      text-shadow: 0 0 20px #0f0;
      animation: glitch 4s infinite;

    @keyframes glitch {
